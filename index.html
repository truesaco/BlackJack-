<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blackjack</title>
  <meta name="description" content="A blackjack game powered by the Deck of Cards API." />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <section class="auth hidden" id="auth">
    <div class="auth-card">
      <h1>Blackjack</h1>
      <p class="auth-sub" id="auth-sub">Sign in to take a seat at the table.</p>

      <button type="button" class="btn google" id="google-signin">
        <svg viewBox="0 0 48 48" width="20" height="20" aria-hidden="true">
          <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/>
          <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/>
          <path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/>
          <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/>
        </svg>
        Continue with Google
      </button>

      <div class="divider"><span>or</span></div>

      <form id="email-form" novalidate>
        <label for="email">Email</label>
        <input type="email" id="email" autocomplete="email" required />
        <label for="password">Password</label>
        <input type="password" id="password" autocomplete="current-password" minlength="6" required />
        <button type="submit" class="btn primary" id="email-submit">Sign in</button>
      </form>

      <p class="auth-error" id="auth-error" role="alert"></p>
      <p class="auth-info" id="auth-info" role="status"></p>

      <p class="auth-switch">
        <span id="switch-text">New here?</span>
        <button type="button" class="btn link" id="switch-mode">Create an account</button>
      </p>
      <button type="button" class="btn link" id="forgot">Forgot password?</button>
    </div>
  </section>

  <div class="app hidden" id="app">
  <header class="topbar">
    <h1>Blackjack</h1>
    <div class="stats">
      <span>Bankroll: <strong id="bankroll">$1000</strong></span>
      <span>Bet: <strong id="bet">$0</strong></span>
      <span class="shoe">Shoe: <strong id="remaining">–</strong> cards</span>
    </div>
    <div class="user">
      <span id="user-email"></span>
      <button type="button" class="btn link" id="signout">Sign out</button>
    </div>
  </header>

  <main class="table">
    <section class="hand-area">
      <h2>Dealer <span class="score" id="dealer-score"></span></h2>
      <div class="cards" id="dealer-cards"></div>
    </section>

    <div class="message" id="message" role="status" aria-live="polite">Place your bet to begin.</div>

    <section class="hand-area">
      <h2>You <span class="score" id="player-score"></span></h2>
      <div class="cards" id="player-cards"></div>
    </section>

    <section class="controls">
      <div class="betting" id="betting">
        <div class="chips">
          <button class="chip c5" data-chip="5">5</button>
          <button class="chip c25" data-chip="25">25</button>
          <button class="chip c100" data-chip="100">100</button>
          <button class="chip c500" data-chip="500">500</button>
        </div>
        <div class="row">
          <button id="clear-bet" class="btn secondary">Clear</button>
          <button id="deal" class="btn primary" disabled>Deal</button>
        </div>
      </div>

      <div class="actions hidden" id="actions">
        <button id="hit" class="btn primary">Hit</button>
        <button id="stand" class="btn primary">Stand</button>
        <button id="double" class="btn secondary">Double</button>
      </div>

      <div class="actions hidden" id="next">
        <button id="new-round" class="btn primary">Next Hand</button>
      </div>

      <button id="reset" class="btn link">Reset bankroll</button>
    </section>
  </main>

  <footer>
    Cards by <a href="https://deckofcardsapi.com/" target="_blank" rel="noopener">Deck of Cards API</a>.
    6-deck shoe · Dealer stands on all 17s · Blackjack pays 3:2
  </footer>
  </div>

  <div class="loading" id="loading">Loading…</div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="app.js"></script>
  <script src="auth.js"></script>
</body>
</html>
